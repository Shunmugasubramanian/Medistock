
spring.application.name=medistock-backend

# Local development uses application-local.properties (git-ignored)
spring.profiles.default=local

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medistock?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Email / SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT authentication
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=60

# Frontend / CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Application email settings
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@medistock.local}

# Server
server.port=${PORT:8080}
